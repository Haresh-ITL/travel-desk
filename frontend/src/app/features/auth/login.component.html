<div class="login-container">
  <!-- Left Side - 70% Branding Section -->
  <div class="login-left" @fadeInLeft>
    <div class="branding-content">
      <div class="logo-section">
        <div class="logo-wrapper">
          <mat-icon class="brand-logo">flight</mat-icon>
          <div class="logo-glow"></div>
        </div>
        <h1 class="brand-title">ITL Travel Desk</h1>
        <p class="brand-subtitle">Enterprise Travel Management Platform</p>
      </div>
      
      <div class="features-section">
        <div class="feature-item" *ngFor="let feature of features; let i = index" [@slideInUp]="{value: '', params: {delay: i * 100}}">
          <div class="feature-icon">
            <mat-icon>{{ feature.icon }}</mat-icon>
          </div>
          <div class="feature-content">
            <h3>{{ feature.title }}</h3>
            <p>{{ feature.description }}</p>
          </div>
        </div>
      </div>

      <div class="animated-background">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
      </div>
    </div>
  </div>

  <!-- Right Side - 30% Login Form -->
  <div class="login-right" @fadeInRight>
    <div class="login-form-wrapper">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>Sign in to continue to your account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width form-field" [@slideIn]="{value: '', params: {delay: 100}}">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="you@company.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width form-field" [@slideIn]="{value: '', params: {delay: 200}}">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" class="password-toggle">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="login-button full-width" 
          [disabled]="loading || loginForm.invalid"
          [@pulse]="loginForm.valid && !loading ? 'pulse' : 'default'">
          <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
          <span *ngIf="!loading" class="button-text">
            <mat-icon>login</mat-icon>
            Sign In
          </span>
        </button>
      </form>
    </div>
  </div>
</div>
