<div class="login-container">
  <div class="animated-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="floating-particles">
      <div class="particle" *ngFor="let i of [1,2,3,4,5,6,7,8]"></div>
    </div>
    
    <!-- Animated Flight -->
    <div class="animated-flight">
      <mat-icon class="flight-icon">flight</mat-icon>
      <div class="flight-trail"></div>
    </div>
    
    <!-- Animated Train -->
    <div class="animated-train">
      <div class="train-container">
        <mat-icon class="train-icon">train</mat-icon>
        <div class="train-smoke">
          <div class="smoke-particle" *ngFor="let i of [1,2,3,4,5]"></div>
        </div>
      </div>
      <div class="train-tracks"></div>
    </div>
  </div>
  
  <div class="login-card-wrapper" @fadeInUp>
    <mat-card class="login-card">
      <mat-card-header>
        <div class="login-header">
          <div class="icon-wrapper">
            <mat-icon class="login-icon">flight</mat-icon>
            <div class="icon-glow"></div>
          </div>
          <h1>ITL travel desk</h1>
          <p>Sign in to manage your travel</p>
        </div>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width animated-field" @slideIn>
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Enter your email">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              Please enter a valid email
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width animated-field" @slideIn>
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Enter your password">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" class="password-toggle">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            class="login-button full-width" 
            [disabled]="loading || loginForm.invalid"
            [@pulse]="loginForm.valid && !loading ? 'pulse' : 'default'">
            <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
            <span *ngIf="!loading" class="button-text">
              <mat-icon>login</mat-icon>
              Sign In
            </span>
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
