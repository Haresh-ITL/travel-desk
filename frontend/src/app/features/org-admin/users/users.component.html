<div class="users-container">
  <div class="users-header">
    <h1>User Management</h1>
    <button mat-raised-button color="primary" (click)="openAddUserDialog()">
      <mat-icon>add</mat-icon>
      Add User
    </button>
  </div>

  <div class="users-toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search users</mat-label>
      <input matInput [(ngModel)]="searchText" (ngModelChange)="applyFilter()" placeholder="Name, email, or role">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <mat-sidenav-container class="users-sidenav-container">
    <mat-sidenav-content>
      <div class="table-container">
        <table mat-table [dataSource]="filteredUsers" class="users-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let user">{{ user.name }}</td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <ng-container matColumnDef="roleName">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let user">
              <mat-chip [color]="getRoleColor(user.roleName)" highlighted>
                {{ getRoleDisplay(user.roleName) }}
              </mat-chip>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button (click)="selectUser(user)" matTooltip="View Details">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button (click)="openAssignManagersDialog(user)" 
                      *ngIf="user.roleName === 'EMPLOYEE'" matTooltip="Assign Managers">
                <mat-icon>supervisor_account</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectUser(row)" class="clickable-row"></tr>
        </table>
      </div>
    </mat-sidenav-content>

    <mat-sidenav #drawer position="end" mode="over" [opened]="!!selectedUser" (closed)="closeDrawer()">
      <div class="drawer-content" *ngIf="selectedUser">
        <div class="drawer-header">
          <h2>User Details</h2>
          <button mat-icon-button (click)="closeDrawer()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <div class="drawer-body">
          <div class="detail-item">
            <span class="label">Name:</span>
            <span class="value">{{ selectedUser.name }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Email:</span>
            <span class="value">{{ selectedUser.email }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Role:</span>
            <mat-chip [color]="getRoleColor(selectedUser.roleName)" highlighted>
              {{ getRoleDisplay(selectedUser.roleName) }}
            </mat-chip>
          </div>
        </div>
        <div class="drawer-actions">
          <button mat-raised-button color="primary" (click)="openAssignManagersDialog(selectedUser)" 
                  *ngIf="selectedUser.roleName === 'EMPLOYEE'">
            <mat-icon>supervisor_account</mat-icon>
            Assign Managers
          </button>
        </div>
      </div>
    </mat-sidenav>
  </mat-sidenav-container>
</div>
